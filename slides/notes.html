<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Presenter view &middot; curly-engine office hours</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #06080c;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #7ee787;
    --warn: #f0883e;
    --card: #0d1117;
    --line: #21262d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 17px/1.55 -apple-system, system-ui, "Segoe UI", sans-serif; }
  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 14px 18px; border-bottom: 1px solid var(--line); gap: 14px;
  }
  header .title { font-size: 15px; color: var(--muted); }
  header .title b { color: var(--fg); }
  header .center { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 28px; text-align: center; }
  header .right { text-align: right; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); font-size: 22px; }
  header .right small { color: var(--muted); font-size: 12px; display:block; }
  main {
    display: grid; grid-template-rows: 1fr auto; height: calc(100vh - 70px);
  }
  .now {
    padding: 22px 26px 12px; overflow: auto;
  }
  .now h1 { margin: 0 0 8px; font-size: 26px; color: var(--accent); }
  .now p { font-size: 19px; line-height: 1.6; white-space: pre-wrap; }
  .next {
    border-top: 1px solid var(--line); padding: 14px 26px 18px;
    background: var(--card); color: var(--muted);
  }
  .next .label { text-transform: uppercase; letter-spacing: 2px; font-size: 11px; color: var(--muted); }
  .next .next-title { color: var(--fg); font-size: 17px; margin-top: 4px; }
  .next .next-notes { font-size: 14px; color: var(--muted); margin-top: 6px;
                      max-height: 5.5em; overflow: hidden; text-overflow: ellipsis; }
  .controls {
    position: fixed; bottom: 14px; right: 18px; display: flex; gap: 8px;
  }
  .controls button {
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit;
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .pace.ok   { color: var(--accent-2); }
  .pace.warn { color: var(--warn); }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    background: rgba(88,166,255,.15); color: var(--accent); border: 1px solid rgba(88,166,255,.35);
    font-size: 12px; margin-left: 8px; vertical-align: middle;
  }
</style>
</head>
<body>
<header>
  <div class="title">presenter view &middot; <b>curly-engine</b> office hours <span class="badge" id="conn">connecting&hellip;</span></div>
  <div class="center" id="timer">00:00</div>
  <div class="right" id="counter">- / -<small id="pace">target: see agenda</small></div>
</header>
<main>
  <section class="now">
    <h1 id="title">waiting for slide&hellip;</h1>
    <p id="notes">Open <code>slides/index.html</code> in your projector window and this page will sync automatically.</p>
  </section>
  <section class="next">
    <div class="label">up next</div>
    <div class="next-title" id="next-title">&mdash;</div>
    <div class="next-notes" id="next-notes">&mdash;</div>
  </section>
</main>
<div class="controls">
  <button id="prev" title="previous slide (←)">&larr; prev</button>
  <button id="next" title="next slide (→)">next &rarr;</button>
</div>

<script>
(() => {
  const channel = new BroadcastChannel('curly-deck');
  const $ = (id) => document.getElementById(id);

  // Mirror of the deck's notes - kept here so we can show "up next" without
  // having to round-trip every navigation through the broadcast channel.
  // The deck pushes its full notes table on first connect.
  let state = { index: 0, total: 0, notes: '', title: '' };
  let allNotes = []; // populated lazily from the deck

  function fmtTime(s) {
    const m = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    return `${m}:${ss}`;
  }

  // pacing hints per slide index (rough targets in seconds from start of talk)
  const pace = [
    { idx: 0,  target: 60,   label: 'intro 1 min' },
    { idx: 1,  target: 150,  label: 'agenda 1.5 min' },
    { idx: 2,  target: 240,  label: 'TL;DR 1.5 min' },
    { idx: 3,  target: 360,  label: 'demo1 setup 2 min' },
    { idx: 4,  target: 510,  label: 'before/after 2.5 min' },
    { idx: 5,  target: 720,  label: 'demo1 live 3.5 min' },
    { idx: 6,  target: 810,  label: 'demo1 wrap 1.5 min' },
    { idx: 7,  target: 930,  label: 'demo2 setup 2 min' },
    { idx: 8,  target: 1080, label: 'feature in 5 lines 2.5 min' },
    { idx: 9,  target: 1290, label: 'demo2 live 3.5 min' },
    { idx: 10, target: 1380, label: 'demo2 wrap 1.5 min' },
    { idx: 11, target: 1440, label: 'harness 1 min' },
    { idx: 12, target: 1500, label: 'gotchas 1 min' },
    // best practices section (slides 13–18)
    { idx: 13, target: 1560, label: 'best practices intro 1 min' },
    { idx: 14, target: 1650, label: 'BP 1&2 — permissions / concurrency 1.5 min' },
    { idx: 15, target: 1740, label: 'BP 3&4 — SHA pinning / caching 1.5 min' },
    { idx: 16, target: 1830, label: 'BP 5&6 — timeouts / reusable workflows 1.5 min' },
    { idx: 17, target: 1920, label: 'BP 7&8 — path filters / test annotations 1.5 min' },
    { idx: 18, target: 2010, label: 'BP 9&10 — artifact retention / secret scoping 1.5 min' },
    { idx: 19, target: 2040, label: 'recap & Q&A' },
  ];

  function paceFor(i) {
    return pace.find((p) => p.idx === i) || pace[pace.length - 1];
  }

  function render() {
    $('title').textContent   = state.title || '(untitled slide)';
    $('notes').textContent   = state.notes || '(no presenter notes for this slide)';
    $('counter').firstChild.textContent = `${state.index + 1} / ${state.total || '?'}  `;
    $('pace').textContent = `target: ${paceFor(state.index).label}`;

    const nextIdx = state.index + 1;
    if (allNotes[nextIdx]) {
      $('next-title').textContent = allNotes[nextIdx].title || `slide ${nextIdx + 1}`;
      $('next-notes').textContent = allNotes[nextIdx].notes || '';
    } else {
      $('next-title').textContent = nextIdx >= state.total ? '— end —' : `slide ${nextIdx + 1}`;
      $('next-notes').textContent = '';
    }
  }

  channel.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.type === 'slide') {
      $('conn').textContent = 'connected';
      $('conn').style.color = 'var(--accent-2)';
      state = m;
      allNotes[m.index] = { title: m.title, notes: m.notes };
      render();
    } else if (m.type === 'all-notes') {
      allNotes = m.notes;
      render();
    } else if (m.type === 'timer') {
      $('timer').textContent = fmtTime(m.seconds);
      const target = paceFor(state.index).target;
      const drift = m.seconds - target;
      $('pace').className = Math.abs(drift) < 60 ? 'pace ok' : 'pace warn';
      $('pace').textContent = `target ${paceFor(state.index).label} · ${drift >= 0 ? '+' : ''}${drift}s`;
    }
  });

  // ask the deck to send its current state
  channel.postMessage({ type: 'request-state' });

  // ---- nav buttons ----
  function nav(delta) {
    const next = Math.max(0, Math.min((state.total || 1) - 1, state.index + delta));
    channel.postMessage({ type: 'nav', index: next });
  }
  $('prev').onclick = () => nav(-1);
  $('next').onclick = () => nav(+1);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { nav(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { nav(-1); e.preventDefault(); }
  });

  // graceful disconnect detection
  setInterval(() => {
    // we don't actually have heartbeats; just nudge re-state on first load.
  }, 5000);
})();
</script>
</body>
</html>
