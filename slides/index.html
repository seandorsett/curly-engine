<template class="slide-src"
  data-notes="One-sentence version of each feature. Don't go into syntax yet — that's the next two sections. The point of this slide is to set the 'why does this matter' frame: both features remove the need for a workaround we've all been doing for years.">
  <h2>The TL;DR</h2>
  <div class="grid2">
    <div>
      <h3>Service container overrides</h3>
      <p>You can finally set <code>entrypoint:</code> and <code>command:</code> on a <code>services:</code> entry. No more baking custom images just to flip a flag.</p>
      <span class="pill">shipped early April 2026</span>
    </div>
    <div>
      <h3><code>deployment: false</code></h3>
      <p>Use an environment for its <i>secrets</i> and <i>approvals</i> without producing a <code>Deployment</code> object, webhook, or timeline entry.</p>
      <span class="pill">shipped Q1 2026, GA April</span>
    </div>
  </div>
</template>

<template class="slide-src"
  data-notes="Pain point setup for demo 1. Most people in the room have hit this — they wanted Redis with a password, or Postgres with a seed file, and ended up either writing a Dockerfile or doing a 'sleep + redis-cli CONFIG SET' dance in a step. Ask the room: 'who has a custom service image just to add one flag?' — usually a few hands.">
  <h2>Demo 1 &middot; The pain we're removing</h2>
  <ul>
    <li>The <code>services:</code> block historically only let you tweak the image with <code>options:</code>, which forwards to <code>docker create</code>.</li>
    <li>Anything that changed how the <i>process</i> ran (auth, init scripts, alt configs) required a custom image push or a step-level hack.</li>
    <li>Result: a fleet of one-flag-different forks of <code>redis:alpine</code>, <code>postgres:16</code>, etc.</li>
  </ul>
  <p style="margin-top:auto;" class="pill warn">Show of hands: who maintains a custom service image right now?</p>
</template>

<template class="slide-src"
  data-notes="This is the side-by-side. Spend ~90s here. Point at the right-hand column: 'entrypoint and command are siblings of image. They behave like docker run --entrypoint X image Y Z.' Note the health-check on the right now uses -a because the server is password-protected — same secret on both sides.">
  <h2>Demo 1 &middot; Before &amp; after</h2>
  <div class="grid2">
    <div>
      <h3>Before</h3>
<pre><span class="k">services</span>:
  <span class="n">redis</span>:
    <span class="k">image</span>: <span class="s">redis:7-alpine</span>
    <span class="k">options</span>: >-
      --health-cmd <span class="s">"redis-cli ping"</span>
<span class="c"># password? bake a custom image
# or run CONFIG SET in a step</span></pre>
    </div>
    <div>
      <h3>After (April 2026)</h3>
<pre><span class="k">services</span>:
  <span class="n">redis</span>:
    <span class="k">image</span>: <span class="s">redis:7-alpine</span>
<span class="hl">    <span class="k">entrypoint</span>: <span class="s">redis-server</span></span>
<span class="hl">    <span class="k">command</span>: >-
      --requirepass ${{ secrets.PW }}
      --maxmemory 64mb</span>
    <span class="k">options</span>: >-
      --health-cmd <span class="s">"redis-cli -a $PW ping"</span></pre>
    </div>
  </div>
</template>

  <h2>Demo 1 &middot; Live</h2>
  <ul>
    <li>Trigger <code>demo-1 service container overrides</code> via <i>Run workflow</i>.</li>
    <li>Three jobs run in parallel:
      <ul>
        <li><code>before-overrides</code> &mdash; baseline, no auth.</li>
        <li><code>with-entrypoint-override</code> &mdash; redis with <code>--requirepass</code>.</li>
        <li><code>postgres-bootstrap</code> &mdash; swap entrypoint to drop a seed file before <code>docker-entrypoint.sh</code>.</li>

<template class="slide-src"
  data-notes="Land the value here. Don't list ALL use cases — pick three that resonate. Also surface the gotcha: entrypoint replaces, not appends. If you only set command, the image's entrypoint still runs (useful) — if you only set entrypoint, you have to provide arguments yourself.">
  <h2>Demo 1 &middot; Where this earns its keep</h2>
  <ul>
    <li><b>Auth-required test fixtures.</b> Redis, MySQL, Mongo &mdash; turn auth on with a flag instead of a Dockerfile.</li>
    <li><b>Init-time bootstrap.</b> Drop seed SQL/JSON into the image's init.d before the real entrypoint runs.</li>
    <li><b>Alternate binaries.</b> Same image, different daemon (e.g. <code>redis-sentinel</code> instead of <code>redis-server</code>).</li>
  </ul>
  <p class="pill warn" style="margin-top:auto">Gotcha: <code>entrypoint</code> replaces the image default. If you only need to pass args, set <code>command:</code> alone.</p>
  <p class="pill warn">Gotcha: <code>secrets</code> context is <b>not</b> allowed in <code>services.&lt;svc&gt;.command</code> / <code>.options</code>. Use <code>services.&lt;svc&gt;.env</code> or a step-level <code>env:</code> instead.</p>
</template>

<template class="slide-src"
  data-notes="Pivot to demo 2. Re-set the frame: environments are great, but they were over-coupled to 'shipping a version of the app'. Lots of workflows want the *gate* (approvals + scoped secrets) without claiming a deployment happened. Give a concrete example: a quarterly cache key rotation that needs prod creds.">
  <h2>Demo 2 &middot; What environments were missing</h2>
  <ul>
    <li>An <code>environment:</code> block bundles three things together:
      <ol>
        <li>required reviewers / wait timers / branch policies</li>
        <li>environment-scoped <i>secrets</i> and <i>variables</i></li>
        <li>a <code>Deployment</code> + <code>DeploymentStatus</code> record (UI row + webhook)</li>
      </ol>
    </li>
    <li>Sometimes you want #1 and #2 but not #3.</li>
    <li>Old workaround: a second environment named <code>prod-ops</code> with the same secrets, or worse, repo-level secrets gated by manual review.</li>
  </ul>
</template>

<template class="slide-src"
  data-notes="The whole feature in one diff. Read it out loud: 'set deployment to false to opt out of the deployment record while keeping everything else.' Mention that the `deployments: write` permission is still required for jobs that DO want a real deployment — that's why the workflow declares it at the top.">
  <h2>Demo 2 &middot; The whole feature in 5 lines</h2>
<pre><span class="k">jobs</span>:
  <span class="n">audit-prod-config</span>:
    <span class="k">runs-on</span>: <span class="s">ubuntu-latest</span>
    <span class="k">environment</span>:
      <span class="k">name</span>: <span class="s">production</span>
<span class="hl">      <span class="k">deployment</span>: <span class="n">false</span>   <span class="c"># keep the gate, drop the deployment record</span></span>
    <span class="k">steps</span>:
      - <span class="k">run</span>: <span class="s">./scripts/audit.sh</span>
        <span class="k">env</span>:
          API_TOKEN: ${{ secrets.API_TOKEN }}</pre>
  <ul style="margin-top:14px">
    <li>Required reviewers? <span class="pill good">still apply</span></li>
    <li>Environment secrets? <span class="pill good">still scoped</span></li>
    <li><code>deployment</code> webhook? <span class="pill warn">not fired</span></li>
    <li>Environments UI row? <span class="pill warn">not created</span></li>
  </ul>
</template>

  <h2>Demo 2 &middot; Live A/B</h2>

<template class="slide-src"
  data-notes="Use cases that hit home. Cache rotation, secret rotation, audit scripts, smoke tests against prod, schema-drift checks. All of these used to either create misleading deployment rows or get gated through repo secrets without proper review. Now they don't have to.">
  <h2>Demo 2 &middot; Where this earns its keep</h2>
  <ul>
    <li><b>Maintenance workflows</b> &mdash; cache/secret rotation, key rolls, cron-style cleanups.</li>
    <li><b>Read-only prod audits</b> &mdash; drift detection, config dumps, compliance scans.</li>
    <li><b>Smoke tests post-release</b> &mdash; want prod creds + approval, but the deploy already happened upstream.</li>
    <li><b>Data exports</b> &mdash; touching prod data with reviewer approval, not "shipping" anything.</li>
  </ul>
</template>

<template class="slide-src"

  <h2>The webhook harness</h2>
  <ul>
    <li><code>POST /events</code> &mdash; workflow jobs push status here.</li>
    <li><code>GET /stream</code> &mdash; Server-Sent Events feed consumed by the dashboard.</li>
    <li><code>GET /</code> &mdash; live table; filter by demo, run, or job result.</li>
    <li>Auth: <code>x-demo-token</code> header matches <code>WEBHOOK_TOKEN</code>.</li>

<template class="slide-src"
  data-notes="Gotchas worth calling out so people don't get bitten in the parking lot. Service containers: entrypoint resets, not appends. deployment:false: still need an environment to exist in repo settings; protection rules still apply, so don't be surprised when the job pauses for approval.">
  <h2>Gotchas</h2>
  <ul>
    <li><b>Service overrides</b>: <code>entrypoint</code> <i>replaces</i> the image default. To just add args, set <code>command:</code> only.</li>
    <li><b>Service overrides</b>: shell expansion happens in the runner's shell, not the container &mdash; quote carefully.</li>
    <li><b>deployment: false</b>: the environment must still exist in repo settings; approvals/wait-timers still apply.</li>
    <li><b>deployment: false</b>: jobs that previously listened for <code>deployment_status</code> webhooks won't see these runs &mdash; intentional, but worth auditing.</li>
  </ul>
</template>

<template class="slide-src"
  data-notes="Transition slide. Say: 'before we open the floor, a rapid-fire round of 10 best practices — things that come up constantly in code review and Actions audits. Q&A format: I'll pose the question, give the answer, and we'll keep it moving. Flag anything you want to dig into at the end.'">
  <span class="eyebrow">Best practices</span>
  <h1>10 GitHub Actions practices worth knowing</h1>
  <p style="color: var(--muted); font-size: 19px;">Q&amp;A format &middot; five slides &middot; two practices per slide</p>
  <ul class="bp-toc">
    <li><b>1.</b> Scope permissions per job</li>
    <li><b>2.</b> Cancel stale PR runs</li>
    <li><b>3.</b> Pin actions to a commit SHA</li>
    <li><b>4.</b> Cache dependency installs</li>
    <li><b>5.</b> Set explicit job timeouts</li>
    <li><b>6.</b> Reusable workflows over copy-paste</li>
    <li><b>7.</b> Filter triggers with paths</li>
    <li><b>8.</b> Surface test results as annotations</li>
    <li><b>9.</b> Manage artifact retention</li>
    <li><b>10.</b> Scope secrets to the step, not the job</li>
  </ul>
</template>

<template class="slide-src"
  data-notes="Practice 1 — permissions. Most people leave this at the default (read/write everything). Each job should list exactly what it needs: contents:read for a test job, packages:write for a publish job, etc. Set a restrictive default at the workflow level and escalate per-job. | Practice 2 — concurrency. Without this, 10 rapid pushes queue 10 runs. The group key scopes cancellation: use github.ref for branch-level, or github.workflow+github.ref for a tighter scope. In-progress cancellation means only the latest push runs.">
  <h2>Best practices 1 &amp; 2</h2>
  <div class="bp-grid">
    <div class="bp-card">
      <span class="bp-num">#1</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">How do I lock down what a workflow can write to my repo?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">Declare <code>permissions:</code> at the <b>job level</b>, not the workflow level. Set <code>contents: read</code> as the workflow default and grant elevated scopes (e.g. <code>packages: write</code>) only to the specific job that needs them. Least-privilege at the job boundary.</span></div>
<pre style="margin-top:6px; font-size:12px"><span class="k">permissions</span>: <span class="s">read-all</span>   <span class="c"># workflow default</span>
<span class="k">jobs</span>:
  <span class="n">publish</span>:
    <span class="k">permissions</span>:
      <span class="k">packages</span>: <span class="s">write</span>  <span class="c"># escalate only here</span></pre>
    </div>
    <div class="bp-card">
      <span class="bp-num">#2</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">How do I stop wasting CI minutes when developers push rapidly?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">Add a <code>concurrency:</code> block keyed to the ref. Setting <code>cancel-in-progress: true</code> automatically cancels the previous run when a new commit lands on the same branch — only the latest run completes.</span></div>
<pre style="margin-top:6px; font-size:12px"><span class="k">concurrency</span>:
  <span class="k">group</span>: <span class="s">${{ github.workflow }}-${{ github.ref }}</span>
  <span class="k">cancel-in-progress</span>: <span class="n">true</span></pre>
    </div>
  </div>
</template>

<template class="slide-src"
  data-notes="Practice 3 — SHA pinning. Tags like @v4 are mutable — a maintainer (or attacker) can move the tag. A full commit SHA is immutable. The human-readable tag goes in a comment next to it so future reviewers know what they're looking at. Dependabot or a tool like Renovate can keep SHAs fresh. | Practice 4 — caching. The setup-* family of actions has a cache: true input that handles this automatically. For custom toolchains, use actions/cache with a key that includes the hash of the lock file. A stale cache hit is worse than no cache, so the lock file in the key is non-negotiable.">
  <h2>Best practices 3 &amp; 4</h2>
  <div class="bp-grid">
    <div class="bp-card">
      <span class="bp-num">#3</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">Is it safe to reference a third-party action with <code>@v4</code>?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">No — tags are mutable. Pin to a <b>full commit SHA</b> for any action you don't control. Add the human-readable tag as a comment. Let Renovate or Dependabot keep the SHA current.</span></div>
<pre style="margin-top:6px; font-size:12px"><span class="c"># risky</span>
- <span class="k">uses</span>: <span class="s">actions/checkout@v4</span>
<span class="c"># safe</span>
- <span class="k">uses</span>: <span class="s">actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683</span>
          <span class="c"># v4.2.2</span></pre>
    </div>
    <div class="bp-card">
      <span class="bp-num">#4</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">My workflow spends 3 minutes on <code>pip install</code> every single run. How do I fix it?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">Enable the <code>cache:</code> input on <code>actions/setup-python</code> (and its siblings). For custom toolchains use <code>actions/cache</code> with a key that hashes the lock file — that ensures a changed <code>requirements.txt</code> busts the cache automatically.</span></div>
<pre style="margin-top:6px; font-size:12px">- <span class="k">uses</span>: <span class="s">actions/setup-python@v5</span>
  <span class="k">with</span>:
    <span class="k">python-version</span>: <span class="s">"3.12"</span>
    <span class="k">cache</span>: <span class="s">pip</span>       <span class="c"># key includes requirements hash</span></pre>
    </div>
  </div>
</template>

<template class="slide-src"
  data-notes="Practice 5 — timeouts. The GitHub-hosted default is 6 hours. A stuck test suite or network hang can silently consume that. Set a realistic ceiling per job — most builds under 30 min, most deployments under 15. For individual long-running steps, use the step-level timeout-minutes too. | Practice 6 — reusable workflows. workflow_call turns any workflow into a callable unit. The caller passes inputs and secrets; the callee runs on its own runners. The alternative — copy-pasting 50 lines of YAML — means every repo drifts independently. One central workflow file = one place to patch.">
  <h2>Best practices 5 &amp; 6</h2>
  <div class="bp-grid">
    <div class="bp-card">
      <span class="bp-num">#5</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">A runaway job consumed 6 hours of CI minutes. How do I prevent that?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">Set <code>timeout-minutes:</code> on every job. The default is 360 min (6 hours). Most jobs should be &lt; 30 min. Also set it on individual <code>steps</code> for commands that can hang (e.g. integration-test suites).</span></div>
<pre style="margin-top:6px; font-size:12px"><span class="k">jobs</span>:
  <span class="n">test</span>:
    <span class="k">runs-on</span>: <span class="s">ubuntu-latest</span>
    <span class="k">timeout-minutes</span>: <span class="n">20</span>   <span class="c"># not 360</span></pre>
    </div>
    <div class="bp-card">
      <span class="bp-num">#6</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">I copy-paste the same 50 lines of YAML into every repo. Is there a better way?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">Yes — <b>reusable workflows</b> (<code>on: workflow_call</code>). Extract the shared logic into a central repo and call it with <code>uses:</code>. Inputs and secrets are passed explicitly; the pattern is one file to patch instead of N.</span></div>
<pre style="margin-top:6px; font-size:12px"><span class="c"># caller</span>
<span class="k">jobs</span>:
  <span class="n">build</span>:
    <span class="k">uses</span>: <span class="s">org/platform/.github/workflows/build.yml@main</span>
    <span class="k">with</span>:
      <span class="k">node-version</span>: <span class="s">"22"</span></pre>
    </div>
  </div>
</template>

<template class="slide-src"
  data-notes="Practice 7 — path filters. Without paths:, a docs typo fix triggers your full integration suite. paths: and paths-ignore: accept glob patterns. Combine with pull_request so PRs also benefit. One common gotcha: if all changed files match paths-ignore: the workflow is skipped entirely — remember to set a required-status-checks bypass for that case. | Practice 8 — test annotations. Raw logs don't give reviewers context. JUnit XML via dorny/test-reporter (or the built-in test summary API) surfaces failures as PR annotations and a structured job summary. Engineers see exactly which test failed without digging through logs.">
  <h2>Best practices 7 &amp; 8</h2>
  <div class="bp-grid">
    <div class="bp-card">
      <span class="bp-num">#7</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">My workflow triggers on every push, even for docs-only changes. How do I filter?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">Use <code>on.push.paths:</code> (and <code>paths-ignore:</code>) to restrict triggers to files that affect the build. Combine with <code>on.pull_request.paths:</code> for the same effect on PRs. Glob patterns work.</span></div>
<pre style="margin-top:6px; font-size:12px"><span class="k">on</span>:
  <span class="k">push</span>:
    <span class="k">paths</span>:
      - <span class="s">"src/**"</span>
      - <span class="s">"requirements*.txt"</span>
    <span class="k">paths-ignore</span>:
      - <span class="s">"docs/**"</span>
      - <span class="s">"*.md"</span></pre>
    </div>
    <div class="bp-card">
      <span class="bp-num">#8</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">Our test failures are buried in 2,000 lines of logs. How do we surface them?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">Emit a JUnit XML report and upload it; pair with a reporting action or the job-summary API. Failures appear as <b>PR annotations</b> and a structured summary — reviewers see the failing test name, not a wall of text.</span></div>
<pre style="margin-top:6px; font-size:12px">- <span class="k">run</span>: <span class="s">pytest --junit-xml=report.xml</span>
- <span class="k">uses</span>: <span class="s">dorny/test-reporter@v1</span>
  <span class="k">if</span>: <span class="s">always()</span>
  <span class="k">with</span>:
    <span class="k">reporter</span>: <span class="s">java-junit</span>
    <span class="k">path</span>: <span class="s">report.xml</span></pre>
    </div>
  </div>
</template>

<template class="slide-src"
  data-notes="Practice 9 — artifact retention. GitHub's default retention is 90 days. Most artifacts (build outputs, test reports) are only needed for days. Every MB-day costs storage quota. Set retention-days: to the minimum you'll realistically use. Also: don't upload if nothing downstream reads the artifact. | Practice 10 — secret scoping. The most common leak vector is echoing secrets in run: scripts or setting them at the job/env level where every subsequent step sees them. Set env: at the step level only. Pass the secret as an environment variable (never interpolate directly into a shell string) so the runner masks it and the shell doesn't expand it in an unsafe context.">
  <h2>Best practices 9 &amp; 10</h2>
  <div class="bp-grid">
    <div class="bp-card">
      <span class="bp-num">#9</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">Artifacts are eating our storage quota. What's the fix?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">Set <code>retention-days:</code> on every <code>upload-artifact</code> step to the minimum useful window (often 3–7 days for build artifacts, 30 for release binaries). Also: only upload what a downstream job or a human will actually read.</span></div>
<pre style="margin-top:6px; font-size:12px">- <span class="k">uses</span>: <span class="s">actions/upload-artifact@v4</span>
  <span class="k">with</span>:
    <span class="k">name</span>: <span class="s">test-report</span>
    <span class="k">path</span>: <span class="s">report.xml</span>
    <span class="k">retention-days</span>: <span class="n">7</span>   <span class="c"># not 90</span></pre>
    </div>
    <div class="bp-card">
      <span class="bp-num">#10</span>
      <div class="bp-q"><span class="bp-badge q">Q</span><span class="text">How do I use a secret in a script without accidentally leaking it into the log?</span></div>
      <div class="bp-a"><span class="bp-badge a">A</span><span class="text">Scope <code>env:</code> to the <b>step</b> that needs it, not the job. Pass secrets as environment variables — never interpolate <code>${{ secrets.X }}</code> directly into a shell string. The runner masks env-var values; inline interpolation bypasses that protection.</span></div>
<pre style="margin-top:6px; font-size:12px"><span class="c"># risky — interpolated into shell string</span>
- <span class="k">run</span>: <span class="s">curl -H "Authorization: ${{ secrets.TOKEN }}"</span>
<span class="c"># safe — passed as env var, runner masks it</span>
- <span class="k">run</span>: <span class="s">curl -H "Authorization: $API_TOKEN"</span>
  <span class="k">env</span>:
    <span class="k">API_TOKEN</span>: ${{ secrets.TOKEN }}</pre>
    </div>
  </div>
</template>

<template class="slide-src"
  data-notes="Wrap. Repeat the one-sentence summary of each feature. Point at the repo URL on screen. Open the floor — and remember the harness is still running, so if anyone wants to trigger the workflows themselves we can watch the events stream in.">
  <h1>Recap &amp; questions</h1>
  <ul>
    <li>Two features, one theme: <i>fewer workarounds</i>.</li>
    <li><code>services:</code> &mdash; override <code>entrypoint</code> + <code>command</code>; stop maintaining custom images for one-flag changes.</li>
    <li><code>deployment: false</code> &mdash; use environments for gates &amp; secrets without polluting the deployments timeline.</li>
  </ul>
  <p style="margin-top:auto" class="pill good">repo: github.com/seandorsett/curly-engine &middot; branch: claude/github-actions-features-71S3r</p>
</template>

<script>
(() => {
  const deck   = document.getElementById('deck');
  const tmpl   = document.querySelectorAll('template.slide-src');
  const slides = [];
  const notes  = [];

  tmpl.forEach((t, i) => {
    const div = document.createElement('section');
    div.className = 'slide';
    div.dataset.index = i;
    div.innerHTML = t.innerHTML;
    deck.appendChild(div);
    slides.push(div);
    notes.push(t.dataset.notes || '');
  });

  let idx = 0;
  // pick up ?s=N from the URL so the presenter window can navigate
  const params = new URLSearchParams(location.search);
  if (params.has('s')) idx = Math.max(0, Math.min(slides.length - 1, parseInt(params.get('s'), 10) || 0));

  const channel = new BroadcastChannel('curly-deck');
  const counter = document.getElementById('counter');

  function render() {
    slides.forEach((s, i) => s.classList.toggle('active', i === idx));
    counter.textContent = `${idx + 1} / ${slides.length}`;
    channel.postMessage({ type: 'slide', index: idx, total: slides.length,
                          notes: notes[idx], title: slides[idx].querySelector('h1,h2')?.textContent || '' });
    history.replaceState(null, '', `?s=${idx}`);
  }

  function go(delta) {
    idx = Math.max(0, Math.min(slides.length - 1, idx + delta));
    render();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { go(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(-1); e.preventDefault(); }
    else if (e.key === 'Home') { idx = 0; render(); }
    else if (e.key === 'End')  { idx = slides.length - 1; render(); }
    else if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } else if (e.key === 'p' || e.key === 'P') openNotes();
  });

  // listen for nav from the presenter window
  channel.addEventListener('message', (e) => {
    if (e.data?.type === 'nav') { idx = e.data.index; render(); }
    else if (e.data?.type === 'request-state') { render(); }
  });

  // ---- timer ----
  const timerEl = document.getElementById('timer');
  let started = Date.now();
  function tickTimer() {
    const s = Math.floor((Date.now() - started) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    timerEl.textContent = `${mm}:${ss}`;
    channel.postMessage({ type: 'timer', seconds: s });
  }
  setInterval(tickTimer, 1000);
  document.getElementById('reset-timer').onclick = () => { started = Date.now(); tickTimer(); };

  // ---- open presenter view ----
  function openNotes() {
    const w = window.open('notes.html', 'curly-notes',
      'popup=yes,width=720,height=820,menubar=no,toolbar=no,status=no');
    if (!w) alert('Allow popups for this origin to use presenter view.');
  }
  document.getElementById('open-notes').onclick = openNotes;

  render();
})();
</script>
</body>
</html>
